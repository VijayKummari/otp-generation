<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Generator & Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #38bdf8;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --digit-bg: rgba(15, 23, 42, 0.8);
      --digit-border: rgba(99, 102, 241, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.15);
      text-align: center;
      position: relative;
    }

    .badge-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 9999px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .badge.limit {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    /* OTP Display Area */
    .otp-display-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .digit-slot {
      width: 48px;
      height: 56px;
      background: var(--digit-bg);
      border: 1.5px solid var(--digit-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.75rem;
      font-weight: 600;
      color: #38bdf8;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .digit-slot.active {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    /* Button styles */
    .btn-action {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      transition: all 0.3s ease;
    }

    .btn-action:hover:not(:disabled) {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.5);
    }

    .btn-action:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn-action.limit-reached {
      background: rgba(239, 68, 68, 0.2) !important;
      color: #f87171 !important;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .status-text {
      margin-top: 18px;
      font-size: 0.85rem;
      color: var(--text-muted);
      min-height: 20px;
    }

    /* History list */
    .history-card {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .history-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      padding: 6px 10px;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 8px;
      color: #cbd5e1;
    }

    .history-otp {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge-bar">
      <span class="badge" id="attemptBadge">Attempts: 0 / 5</span>
      <span class="badge" id="cooldownBadge" style="display: none;">30s Cooldown</span>
    </div>

    <h1>OTP Verification</h1>
    <p class="subtitle">Click the button below to generate a secure OTP.</p>

    <!-- 6 Digit Slot UI -->
    <div class="otp-display-container" id="otpContainer">
      <div class="digit-slot">-</div>
      <div class="digit-slot">-</div>
      <div class="digit-slot">-</div>
      <div class="digit-slot">-</div>
      <div class="digit-slot">-</div>
      <div class="digit-slot">-</div>
    </div>

    <!-- Interactive Button -->
    <button id="otpBtn" class="btn-action">Generate OTP</button>

    <div class="status-text" id="statusMessage">Ready to generate OTP</div>

    <!-- History of generated OTPs -->
    <div class="history-card" id="historySection" style="display: none;">
      <div class="history-title">Generated OTPs History</div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <script src="index2.js"></script>
</body>
</html>
